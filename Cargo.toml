[package]
name = "onek-deaths"
version = "0.1.0"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
arraystring = { version = "0.3.0", features = [
    "serde-traits",
] } # fixed capacity strings
chrono = "0.4.42" # time library
clap = { version = "4.5.53", features = ["derive"] } # command line parser
crossterm = "0.29.0" # cross-platform terminal library
log = "0.4.29" # simpler logging API
fnv = "1.0.7" # custom hasher that is much more performant for small keys
postcard = { version = "1.1.3", features = [
    "alloc",
] } # binary backend for serde
rand = { version = "0.9.2", features = ["small_rng"] } # random numbers
rand_distr = "0.5.1" # normal (and other) distributions
serde = { version = "1.0.228", features = ["derive"] } # serialization framework
serde_derive = "1.0.228" # serde derive macros
simplelog = "0.12.2" # logging facade

[dev-dependencies]
insta = { version = "1.45.0", features = ["yaml"] }

# Better profiling in release TODO: set this to false
[profile.release]
debug = true
